<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Vehicles</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#20302a;font-family:Arial,sans-serif}header{background:#087f5b;color:white;padding:18px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}a{color:inherit}main{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #e1eae5;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #00000008}input,select,textarea{padding:11px;border:1px solid #ccd8d1;border-radius:7px;width:100%;margin:7px 0 14px}button{background:#087f5b;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;margin:4px}label{font-weight:600} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.muted{color:#64736b}</style></head><body><header><h2>RentMyRide | Find Vehicles</h2><a href="admin-dashboard.html">Admin Dashboard</a></header><main><h1>Find a Rental Vehicle</h1><p class="muted">Search approved vehicles in this browser demo.</p><div class="card"><label>Location</label><input id="loc" placeholder="Enter city or area"><label>Vehicle type</label><select id="type"><option value="">All types</option><option>Car</option><option>Bike</option><option>Scooter</option><option>Van</option></select><button onclick="searchV()">Search</button></div><div id="results"></div></main><script>function searchV(){let a=JSON.parse(localStorage.getItem('rmr_vehicles')||'[]').filter(v=>v.status==='Approved');let t=document.getElementById('type').value,l=document.getElementById('loc').value.toLowerCase();a=a.filter(v=>(!t||v.vehicleType===t)&&(!l||JSON.stringify(v).toLowerCase().includes(l)));document.getElementById('results').innerHTML=a.map(v=>`<div class="card"><h3>${v.vehicleModel||v.vehicleType}</h3><p>${v.registrationNumber||''} · ₹${v.rent}/day</p><p>Provider: ${v.owner||'Provider'}</p></div>`).join('')||'<p>No approved vehicles match your search.</p>';}searchV();</script><script src="rentmyride-app.js"></script></body></html>
