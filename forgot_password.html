<script>
const form = document.getElementById("forgotPasswordForm");
const contactInput = document.getElementById("contact");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const contact = contactInput.value.trim();

    const registeredEmail = localStorage.getItem("registeredEmail");
    const registeredPhone = localStorage.getItem("registeredPhone");

    if (!registeredEmail && !registeredPhone) {
        message.style.color = "#dc2626";
        message.textContent =
            "No signup details found. Please sign up first.";
        return;
    }

    const isRegisteredEmail =
        registeredEmail &&
        contact.toLowerCase() === registeredEmail.toLowerCase();

    const isRegisteredPhone =
        registeredPhone &&
        contact === registeredPhone;

    if (!isRegisteredEmail && !isRegisteredPhone) {
        message.style.color = "#dc2626";
        message.textContent =
            "This email or phone number does not match your signup details.";
        return;
    }

    sessionStorage.setItem("resetContact", contact);
    sessionStorage.setItem("otpPurpose", "forgot");

    message.style.color = "#087f5b";
    message.textContent =
        "Details matched! Opening OTP verification...";

    setTimeout(function() {
        window.location.href = "otp.html";
    }, 1000);
});
</script>
