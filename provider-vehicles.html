<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Vehicles</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#20302a;font-family:Arial,sans-serif}header{background:#087f5b;color:white;padding:18px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}a{color:inherit}main{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #e1eae5;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #00000008}input,select,textarea{padding:11px;border:1px solid #ccd8d1;border-radius:7px;width:100%;margin:7px 0 14px}button{background:#087f5b;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;margin:4px}label{font-weight:600} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.muted{color:#64736b}</style></head><body><header><h2>RentMyRide | My Vehicles</h2><a href="admin-dashboard.html">Admin Dashboard</a></header><main><h1>My Vehicles</h1><p>Vehicle submissions are saved in this browser demo. Admin approval is required before listing.</p><div id="myVehicles"></div></main><script>const a=JSON.parse(localStorage.getItem('rmr_vehicles')||'[]');document.getElementById('myVehicles').innerHTML=a.map(v=>`<div class="card"><b>${v.vehicleModel||v.vehicleType}</b><p>${v.registrationNumber||''} · ₹${v.rent||''}/day</p>Status: ${v.status}</div>`).join('')||'<p>No vehicles added yet.</p>';</script><script src="rentmyride-app.js"></script></body></html>
