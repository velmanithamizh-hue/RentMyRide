<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RentMyRide | Sign Up</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: #f5f7f6;
    }

    .signup-card {
        width: 100%;
        max-width: 420px;
        padding: 38px 32px;
        background: white;
        border: 1px solid #e7eae8;
        border-radius: 16px;
        box-shadow: 0 8px 35px rgba(0, 0, 0, 0.06);
    }

    .logo {
        text-align: center;
        color: #087f5b;
        font-size: 31px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .tagline {
        text-align: center;
        margin-top: 9px;
        margin-bottom: 35px;
        color: #777;
        font-size: 13px;
    }

    h2 {
        font-size: 25px;
        text-align: center;
        color: #202820;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
        color: #777;
        margin-bottom: 28px;
    }

    .input-label {
        display: block;
        color: #333;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 9px;
    }

    .input-box {
        display: flex;
        align-items: center;
        border: 1px solid #d9dfdb;
        border-radius: 9px;
        padding: 0 14px;
        transition: 0.2s;
    }

    .input-box:focus-within {
        border-color: #087f5b;
        box-shadow: 0 0 0 3px rgba(8, 127, 91, 0.08);
    }

    .input-box span {
        font-size: 18px;
        margin-right: 10px;
    }

    .input-box input {
        width: 100%;
        height: 52px;
        border: none;
        outline: none;
        font-size: 14px;
        background: transparent;
    }

    .continue-btn {
        width: 100%;
        height: 50px;
        margin-top: 20px;
        border: none;
        border-radius: 9px;
        background: #087f5b;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .continue-btn:hover {
        background: #066b4d;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        color: #999;
        font-size: 12px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e5e5;
    }

    .google-btn {
        width: 100%;
        height: 48px;
        border: 1px solid #d9dfdb;
        border-radius: 9px;
        background: white;
        color: #333;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .google-btn:hover {
        background: #f8faf9;
    }

    .login-text {
        text-align: center;
        margin-top: 27px;
        font-size: 13px;
        color: #777;
    }

    .login-text a {
        color: #087f5b;
        text-decoration: none;
        font-weight: bold;
    }

    .footer {
        margin-top: 25px;
        text-align: center;
        color: #999;
        font-size: 11px;
    }

    #message {
        font-size: 13px;
        margin-top: 13px;
        text-align: center;
        line-height: 1.5;
    }

    @media (max-width: 450px) {
        .signup-card {
            padding: 30px 22px;
        }
    }
</style>

</head><body><main class="signup-card">

    <div class="logo">🚗 RentMyRide</div>

    <p class="tagline">
        Your Ride, Your Location, Your Choice!
    </p>

    <h2>Create your account</h2>

    <p class="subtitle">
        Enter your email address or mobile number
        to get started.
    </p>

    <form id="signupForm" novalidate>
        <label class="input-label" for="contact">
            Email address or mobile number
        </label>

        <div class="input-box">
            <span>✉</span>

            <input
                type="text"
                id="contact"
                placeholder="Email or mobile number"
                autocomplete="username"
                required
            >
        </div>

        <button type="submit" class="continue-btn">
            Continue →
        </button>

        <p id="message" role="status"></p>

    </form>

    <div class="divider">OR</div>

    <button type="button" class="google-btn"
            onclick="googleMessage()">
        🌐 &nbsp; Continue with Google
    </button>

    <p class="login-text">
        Already have an account?
        <a href="login.html">Log in</a>
    </p>

    <p class="footer">
        By continuing, you agree to our Terms of Service
        and Privacy Policy.
    </p>

</main>

<script>
const signupForm = document.getElementById("signupForm");
const signupContinueBtn = signupForm.querySelector(".continue-btn");
const signupMessage = document.getElementById("message");

signupForm.addEventListener("submit", function(event) {
    event.preventDefault();
    if (signupContinueBtn.disabled) return;

    const contact = document.getElementById("contact").value.trim();
    signupMessage.style.color = "red";
    signupMessage.textContent = "";

    if (contact === "") {
        signupMessage.textContent = "Please enter your Gmail or mobile number.";
        return;
    }

    const isEmail = /^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(contact);
    const isPhone = /^[6-9]\d{9}$/.test(contact);
    if (!isEmail && !isPhone) {
        signupMessage.textContent = "Enter a valid Gmail or 10-digit mobile number.";
        return;
    }

    if (isEmail) {
        sessionStorage.setItem("signupEmail", contact);
        sessionStorage.removeItem("signupPhone");
    } else {
        sessionStorage.setItem("signupPhone", contact);
        sessionStorage.removeItem("signupEmail");
    }

    // Prevent repeated clicks while opening the OTP page.
    signupContinueBtn.disabled = true;
    signupContinueBtn.textContent = "Opening OTP verification...";
    signupContinueBtn.style.opacity = "0.7";
    signupContinueBtn.style.cursor = "wait";
    window.location.href = "./otp.html";
});

function googleMessage() {
    alert("Google signup requires Google authentication setup.");
}
</script>

  <script src="rentmyride-app.js"></script>
</body>
</html>
